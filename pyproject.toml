[project]
name = "learning-observability"
version = "0.1.0"
description = "Notebook lessons for learning LLM observability with LangSmith, from basic tracing to RAG debugging."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.13",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langsmith>=0.14.12",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]
